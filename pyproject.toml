[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-qa-assistant"
version = "0.1.0"
description = "Synthetic-data portfolio MVP: vendor invoice digitization with human QA."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50,<2",
    "pypdf>=6,<7",
    "pydantic>=2,<3",
    "pandas>=2.2,<4",
    "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
